<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Lookup Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    input[type="text"] {
      padding: 10px;
      width: 60%;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 25px;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <h2>District Lookup Portal</h2>
  <form id="searchForm">
    <input type="text" id="placeInput" placeholder="Enter place name..." required />
    <button type="submit">Search</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const placeInput = document.getElementById('placeInput').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.innerHTML = 'Searching...';

      try {
        const response = await fetch(`/api/search?place=${encodeURIComponent(placeInput)}`);
        const data = await response.json();
        
        resultDiv.innerHTML = data.result;
      } catch (error) {
        resultDiv.innerHTML = '<span style="color: red;">An error occurred while fetching results.</span>';
      }
    });
  </script>

</body>
</html>
