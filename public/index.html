<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District Lookup Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h2 {
      margin-bottom: 24px;
      color: #2c3e50;
      font-size: 24px;
      font-weight: 600;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      font-size: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease-in-out;
    }

    input[type="text"]:focus {
      border-color: #3182ce;
    }

    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease-in-out;
    }

    button:hover {
      background-color: #2b6cb0;
    }

    #result {
      margin-top: 25px;
      font-size: 16px;
      line-height: 1.6;
      word-wrap: break-word;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #edf2f7;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Target specific red text outputs */
    .highlight-red {
      color: #e53e3e;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>District Lookup Portal</h2>
    <form id="searchForm" class="search-box">
      <input type="text" id="placeInput" placeholder="Enter place name..." required />
      <button type="submit">Search</button>
    </form>

    <div id="result">Results will appear here...</div>
  </div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const placeInput = document.getElementById('placeInput').value;
      const resultDiv = document.getElementById('result');
      
      resultDiv.innerHTML = 'Searching...';

      try {
        const response = await fetch(`/api/search?place=${encodeURIComponent(placeInput)}`);
        const data = await response.json();
        
        resultDiv.innerHTML = data.result;
      } catch (error) {
        resultDiv.innerHTML = '<span style="color: #e53e3e;">An error occurred while fetching results.</span>';
      }
    });
  </script>

</body>
</html>
